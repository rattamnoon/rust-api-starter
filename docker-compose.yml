services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_QUEUE_NAME: jobs
      RABBITMQ_DEAD_LETTER_QUEUE: jobs.dead
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: rust-api-starter
      KAFKA_TOPIC_USERS: users.events
      KAFKA_TOPIC_ORDERS: orders.events
      KAFKA_TOPIC_RECEIPTS: receipts.events
      WORKER_CONCURRENCY: "8"
      JOB_MAX_RETRIES: "3"
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: local-stripe-webhook-secret
      STRIPE_SUCCESS_URL: http://127.0.0.1:8080/api/v1/orders/success
      STRIPE_CANCEL_URL: http://127.0.0.1:8080/api/v1/orders/cancel
      EMAIL_PROVIDER: log
      EMAIL_FROM: noreply@example.com
      RESEND_API_KEY: ""
      RECEIPT_PREFIX: RCT
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RUST_LOG: info,actix_web=info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_QUEUE_NAME: jobs
      RABBITMQ_DEAD_LETTER_QUEUE: jobs.dead
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: rust-api-starter-worker
      KAFKA_TOPIC_USERS: users.events
      KAFKA_TOPIC_ORDERS: orders.events
      KAFKA_TOPIC_RECEIPTS: receipts.events
      WORKER_CONCURRENCY: "8"
      JOB_MAX_RETRIES: "3"
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: local-stripe-webhook-secret
      STRIPE_SUCCESS_URL: http://127.0.0.1:8080/api/v1/orders/success
      STRIPE_CANCEL_URL: http://127.0.0.1:8080/api/v1/orders/cancel
      EMAIL_PROVIDER: log
      EMAIL_FROM: noreply@example.com
      RESEND_API_KEY: ""
      RECEIPT_PREFIX: RCT
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RUST_LOG: info,actix_web=info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      disable: true

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./publisher"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      RABBITMQ_QUEUE_NAME: jobs
      RABBITMQ_DEAD_LETTER_QUEUE: jobs.dead
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: rust-api-starter-publisher
      KAFKA_TOPIC_USERS: users.events
      KAFKA_TOPIC_ORDERS: orders.events
      KAFKA_TOPIC_RECEIPTS: receipts.events
      WORKER_CONCURRENCY: "8"
      JOB_MAX_RETRIES: "3"
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: local-stripe-webhook-secret
      STRIPE_SUCCESS_URL: http://127.0.0.1:8080/api/v1/orders/success
      STRIPE_CANCEL_URL: http://127.0.0.1:8080/api/v1/orders/cancel
      EMAIL_PROVIDER: log
      EMAIL_FROM: noreply@example.com
      RESEND_API_KEY: ""
      RECEIPT_PREFIX: RCT
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RUST_LOG: info,actix_web=info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

volumes:
  pgdata:
